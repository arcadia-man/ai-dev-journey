<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Knowledge Chat</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Trebuchet MS", sans-serif;
      background: #edf2ee;
      color: #202a25;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }

    .chat-container {
      background: #fffefa;
      border: 1px solid #d7dfd8;
      border-radius: 10px;
      box-shadow: 0 18px 55px rgba(30, 48, 38, 0.1);
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      height: min(900px, 92vh);
      overflow: hidden;
    }

    .chat-header {
      background: #213a30;
      color: #f7f8f2;
      padding: 19px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
    }

    .chat-header h1 {
      font: 600 1.35rem Georgia, serif;
    }

    .chat-header p {
      font-size: 0.82rem;
      color: #cbd7cd;
      margin-top: 5px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .route-status {
      color: #dce8d9;
      font-size: 0.75rem;
      white-space: nowrap;
    }

    .clear-button {
      border: 1px solid #708477;
      border-radius: 5px;
      background: transparent;
      color: #f7f8f2;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
      font-size: 0.78rem;
    }

    .clear-button:hover {
      background: #315143;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 26px clamp(16px, 5vw, 48px);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .message {
      max-width: 85%;
      padding: 12px 15px;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .message.user {
      background: #dce9dc;
      color: #20362b;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .message.assistant {
      background: #f1f3ed;
      color: #26332b;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }

    .message.assistant .answer-text {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .message-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
    }

    .message-meta span {
      background: #e0e8dc;
      color: #45604d;
      border-radius: 3px;
      padding: 2px 6px;
      font-size: 0.68rem;
      font-weight: 700;
    }

    .message.assistant .sources {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #d7ded5;
      font-size: 0.78rem;
      color: #506056;
    }

    .sources summary {
      cursor: pointer;
      color: #34503d;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .source-item {
      background: #fffefa;
      border: 1px solid #dce2d9;
      border-radius: 4px;
      padding: 8px 10px;
      margin-top: 6px;
      font-size: 0.75rem;
      color: #3d4c42;
    }

    .source-item .source-meta {
      color: #708075;
      margin-bottom: 4px;
      font-size: 0.7rem;
    }

    .source-item a {
      color: #a94f36;
      font-weight: 700;
      text-decoration-thickness: 1px;
    }

    .message.loading {
      background: #f1f3ed;
      align-self: flex-start;
      color: #758078;
      font-style: italic;
    }

    .typing-dots span {
      display: inline-block;
      animation: blink 1.2s infinite;
      font-size: 1.4rem;
      line-height: 0.5;
    }

    .typing-dots span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing-dots span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {

      0%,
      80%,
      100% {
        opacity: 0.2;
      }

      40% {
        opacity: 1;
      }
    }

    .chat-input-area {
      display: flex;
      padding: 16px 20px;
      border-top: 1px solid #e2e7df;
      gap: 9px;
      background: #fffefa;
    }

    .chat-input-area input {
      flex: 1;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid #cbd5cc;
      border-radius: 5px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .chat-input-area input:focus {
      border-color: #426b50;
    }

    .chat-input-area button {
      background: #bd5b3d;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 0.92rem;
      transition: opacity 0.2s;
    }

    .chat-input-area button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .chat-input-area button:not(:disabled):hover {
      opacity: 0.85;
    }

    .empty-state {
      text-align: center;
      color: #78847a;
      margin: auto;
      padding: 32px 16px;
    }

    .empty-state h2 {
      font: 500 1.65rem Georgia, serif;
      margin-bottom: 8px;
      color: #2a3b30;
    }

    .empty-state p {
      font-size: 0.85rem;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 16px;
    }

    .suggestion-chip {
      background: #fffefa;
      border: 1px solid #d4ded4;
      border-radius: 4px;
      padding: 7px 11px;
      font-size: 0.8rem;
      cursor: pointer;
      color: #3b5542;
      transition: background 0.2s;
    }

    .suggestion-chip:hover {
      background: #e8efe6;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .chat-container {
        height: 100dvh;
        border: 0;
        border-radius: 0;
      }

      .chat-header {
        padding: 16px;
        align-items: flex-start;
      }

      .chat-header h1 {
        font-size: 1.2rem;
      }

      .chat-header p {
        max-width: 255px;
        line-height: 1.4;
      }

      .header-actions {
        align-items: flex-end;
        flex-direction: column-reverse;
        gap: 8px;
      }

      .route-status {
        font-size: 0.68rem;
      }

      .message {
        max-width: 94%;
      }

      .chat-input-area {
        padding: 12px;
      }

      .chat-input-area button {
        padding-inline: 15px;
      }
    }
  </style>
</head>

<body>
  <div class="chat-container">

    <div class="chat-header">
      <div>
        <h1>Knowledge Chat</h1>
        <p>A conversational assistant that finds the most relevant knowledge for your question.</p>
      </div>
      <div class="header-actions">
        <span class="route-status" id="routeStatus">Ready</span>
        <button class="clear-button" id="clearBtn" type="button" onclick="clearConversation()">New chat</button>
      </div>
    </div>

    <div class="chat-messages" id="messages">
      <div class="empty-state" id="emptyState">
        <h2>What would you like to know?</h2>
        <p>Ask a question, explore an idea, or continue a previous thought.</p>
        <div class="suggestions">
          <button class="suggestion-chip" onclick="ask('Explain a complex idea in simple terms')">Explain a complex idea
            simply</button>
          <button class="suggestion-chip" onclick="ask('Help me compare two approaches to a problem')">Compare two
            approaches</button>
        </div>
      </div>
    </div>

    <div class="chat-input-area">
      <input id="questionInput" type="text" placeholder="Ask anything..."
        onkeydown="if(event.key==='Enter') sendMessage()" />
      <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

  </div>

  <script>
    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("questionInput");
    const sendBtn = document.getElementById("sendBtn");
    const emptyState = document.getElementById("emptyState");
    const routeStatus = document.getElementById("routeStatus");
    const SESSION_KEY = "knowledge-chat-session-id";
    const HISTORY_KEY = "knowledge-chat-history";
    let sessionId = localStorage.getItem(SESSION_KEY) || createSessionId();
    let transcript = [];
    localStorage.setItem(SESSION_KEY, sessionId);

    function createSessionId() {
      return globalThis.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
    }

    function ask(question) {
      inputEl.value = question;
      sendMessage();
    }

    function setLoading(loading) {
      sendBtn.disabled = loading;
      inputEl.disabled = loading;
    }

    function appendMessage(role, content) {
      if (emptyState) emptyState.style.display = "none";

      const msg = document.createElement("div");
      msg.className = `message ${role}`;
      msg.innerHTML = content;
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return msg;
    }

    function renderAssistantMessage(data) {
      const topics = Array.isArray(data.topics) ? data.topics : [];
      const references = Array.isArray(data.references) ? data.references : [];
      const relatedTopics = Array.isArray(data.relatedTopics) ? data.relatedTopics : [];
      const links = Array.isArray(data.links) ? data.links : [];
      const topicHtml = topics.length
        ? `<div class="message-meta">${topics.map((topic) => `<span>${escapeHtml(typeof topic === "string" ? topic : topic.name || topic.id || "")}</span>`).join("")}</div>`
        : "";
      const referencesHtml = renderDataItems("References", references);
      const relatedHtml = renderDataItems("Related topics", relatedTopics);
      const linksHtml = links.length
        ? `<div class="sources"><details><summary>Links (${links.length})</summary>${links.map((link) => {
          const url = safeLink(link.url);
          if (!url) return "";
          return `<div class="source-item"><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(link.label || link.title || url)}</a></div>`;
        }).join("")}</details></div>`
        : "";

      return `${topicHtml}<div class="answer-text">${escapeHtml(data.answer || "")}</div>${referencesHtml}${relatedHtml}${linksHtml}`;
    }

    function renderDataItems(label, items) {
      if (items.length === 0) return "";
      return `<div class="sources"><details><summary>${escapeHtml(label)} (${items.length})</summary>${items.map((item) => {
        const title = item.title || item.topic || item.name || "";
        const page = item.page !== undefined && item.page !== null ? `Page ${item.page}` : "";
        const similarity = Number.isFinite(item.similarity) ? `Match ${(item.similarity * 100).toFixed(1)}%` : "";
        const details = [page, similarity].filter(Boolean).join(" · ");
        return `<div class="source-item">
          ${details ? `<div class="source-meta">${escapeHtml(details)}</div>` : ""}
          ${title ? `<strong>${escapeHtml(title)}</strong>` : ""}
          ${item.data !== undefined ? `<div>${escapeHtml(item.data)}</div>` : ""}
        </div>`;
      }).join("")}</details></div>`;
    }

    function safeLink(value) {
      try {
        const url = new URL(value, window.location.href);
        return ["http:", "https:"].includes(url.protocol) ? url.href : "";
      } catch {
        return "";
      }
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;")
        .replace(/\n/g, "<br>");
    }

    function saveTranscript() {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(transcript));
    }

    function restoreTranscript() {
      try {
        const saved = JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
        if (!Array.isArray(saved)) return;
        transcript = saved.filter((item) => item && ["user", "assistant"].includes(item.role));
        transcript.forEach((item) => appendMessage(item.role, item.role === "assistant" ? renderAssistantMessage(item.data) : escapeHtml(item.text)));
      } catch {
        transcript = [];
      }
    }

    function clearConversation() {
      sessionId = createSessionId();
      transcript = [];
      localStorage.setItem(SESSION_KEY, sessionId);
      localStorage.removeItem(HISTORY_KEY);
      messagesEl.innerHTML = "";
      if (emptyState) {
        emptyState.style.display = "block";
        messagesEl.appendChild(emptyState);
      }
      routeStatus.textContent = "Ready";
      inputEl.focus();
    }

    async function sendMessage() {
      const question = inputEl.value.trim();
      if (!question) return;

      inputEl.value = "";
      setLoading(true);

      appendMessage("user", escapeHtml(question));
      transcript.push({ role: "user", text: question });
      saveTranscript();

      const loadingMsg = appendMessage(
        "loading",
        `Thinking... <span class="typing-dots"><span>•</span><span>•</span><span>•</span></span>`
      );

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, sessionId }),
        });

        if (!response.ok) {
          throw new Error(`Server error: ${response.status}`);
        }

        const data = await response.json();
        sessionId = data.sessionId || sessionId;
        localStorage.setItem(SESSION_KEY, sessionId);
        loadingMsg.remove();

        appendMessage("assistant", renderAssistantMessage(data));
        transcript.push({ role: "assistant", data });
        saveTranscript();
        routeStatus.textContent = Array.isArray(data.topics) && data.topics.length ? data.topics.join(", ") : "Ready";

      } catch (error) {
        loadingMsg.remove();
        appendMessage("assistant", `<span style="color:#c00">Error: ${escapeHtml(error.message)}</span>`);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    restoreTranscript();
  </script>

</body>

</html>
